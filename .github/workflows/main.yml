import requests
import xml.etree.ElementTree as ET
import re

RSS_URL = "https://feeds.feedburner.com/softwaretestinghelp"


def find_image_url(article_url):
    response = requests.get(
        article_url,
        timeout=20,
        headers={
            "User-Agent": "Mozilla/5.0"
        }
    )

    response.raise_for_status()

    html = response.text

    # Try to find the Open Graph image
    match = re.search(
        r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
        html,
        re.IGNORECASE
    )

    if match:
        return match.group(1)

    # Try the reverse attribute order
    match = re.search(
        r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
        html,
        re.IGNORECASE
    )

    if match:
        return match.group(1)

    return None


response = requests.get(
    RSS_URL,
    timeout=20
)

response.raise_for_status()

root = ET.fromstring(response.content)

channel = root.find("channel")

if channel is None:
    raise Exception("RSS channel not found")

articles = channel.findall("item")

print(f"Found {len(articles)} articles")

# Test the first 5 articles
for article in articles[:5]:

    title = article.findtext(
        "title",
        default="No title"
    )

    link = article.findtext(
        "link",
        default="No link"
    )

    print("\n------------------------------")
    print("TITLE:", title)
    print("LINK:", link)

    image_url = find_image_url(link)

    print("IMAGE:", image_url)
